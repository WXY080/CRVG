[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crvg"
version = "0.1.0"
description = "Official implementation of Consensus-Routed Visual Grounding (CRVG)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "Pillow>=10", "tqdm>=4.65", "PyYAML>=6"]

[project.optional-dependencies]
inference = ["torch>=2.2", "torchvision>=0.17", "transformers==4.57.6", "accelerate>=0.30"]
internvl = ["torch>=2.2", "torchvision>=0.17", "transformers==4.44.2", "accelerate>=0.30", "timm>=0.9.12,<2", "einops>=0.6.1", "sentencepiece>=0.2.0"]
analysis = ["matplotlib>=3.8"]
test = ["torch>=2.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["crvg*", "analysis*", "tools*"]
