name: CPU contract tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test contracts and cached workflows
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: |
          python -m compileall -q crvg analysis tools tests
          bash -n pipelines/run_internvl.sh
          bash -n pipelines/run_vlmr1.sh
          bash -n pipelines/run_analysis.sh
